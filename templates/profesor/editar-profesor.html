{% extends 'base.html' %}

{% block page_title %} Estrella de Belén - Editar Profesor {% endblock %}

{% block content %}
<div class="page-header">
    <div class="row align-items-center">
        <div class="col">
            <h3 class="page-title">Editar Profesor</h3>
            <ul class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'teacher_list' %}">Profesores</a></li>
                <li class="breadcrumb-item active">Editar Profesor</li>
            </ul>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-sm-12">
        <div class="card">
            <div class="card-body">
                <form method="post" action="{% url 'edit_teacher' teacher.teacher_id %}">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-12">
                            <h5 class="form-title"><span>Detalles básicos</span></h5>
                        </div>
                        <div class="col-12 col-sm-6">
                            <div class="form-group">
                                <label>ID Profesor</label>
                                <input type="text" class="form-control" name="teacher_id"
                                    value="{{teacher.teacher_id}}">
                            </div>
                        </div>
                        <div class="col-12 col-sm-6">
                            <div class="form-group">
                                <label>Nombre</label>
                                <input type="text" class="form-control" name="teacher_name"
                                    value="{{teacher.teacher_name}}">
                            </div>
                        </div>
                        <div class="col-12 col-sm-6">
                            <div class="form-group">
                                <label>Género</label>
                                <select class="form-control" name="gender">
                                    <option value="Male">Masculino</option>
                                    <option value="Female">Femenino</option>
                                    <option value="Others">Otros</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-12 col-sm-6">
                            <div class="form-group">
                                <label>Fecha de nacimiento</label>
                                <input type="date" class="form-control" name="date_of_birth"
                                    value="{{teacher.date_of_birth | date:'Y-m-d'}}">
                            </div>
                        </div>
                        <div class="col-12 col-sm-6">
                            <div class="form-group">
                                <label>Teléfono</label>
                                <input type="text" class="form-control" name="mobile_number"
                                    value="{{teacher.mobile_number}}">
                            </div>
                        </div>
                        <div class="col-12 col-sm-6">
                            <div class="form-group">
                                <label>Fecha de ingreso</label>
                                <input type="date" class="form-control" name="joining_date"
                                    value="{{teacher.joining_date|date:'Y-m-d'}}">
                            </div>
                        </div>
                        <div class="col-12 col-sm-6">
                            <div class="form-group">
                                <label>Título académico</label>
                                <input class="form-control" type="text" name="qualification"
                                    value="{{teacher.qualification}}">
                            </div>
                        </div>
                        <div class="col-12 col-sm-6">
                            <div class="form-group">
                                <label>Experiencia</label>
                                <input class="form-control" type="text" name="experience"
                                    value="{{teacher.experience}}">
                            </div>
                        </div>
                        <div class="col-12">
                            <h5 class="form-title"><span>Detalles de acceso</span></h5>
                        </div>
                        <div class="col-12 col-sm-6">
                            <div class="form-group">
                                <label>Usuario</label>
                                <input type="text" class="form-control" name="username" value="{{teacher.username}}">
                            </div>
                        </div>
                        <div class="col-12 col-sm-6">
                            <div class="form-group">
                                <label>Correo electrónico</label>
                                <input type="email" class="form-control" name="email" value="{{teacher.email}}">
                            </div>
                        </div>
                        <div class="col-12 col-sm-6">
                            <div class="form-group">
                                <label>Contraseña</label>
                                <input type="password" class="form-control" name="password"
                                    value="{{teacher.password}}">
                            </div>
                        </div>
                        <div class="col-12 col-sm-6">
                            <div class="form-group">
                                <label>Repetir contraseña</label>
                                <input type="password" class="form-control" name="confirm_password"
                                    value="{{teacher.password}}">
                            </div>
                        </div>
                        <div class="col-12">
                            <h5 class="form-title"><span>Dirección</span></h5>
                        </div>
                        <div class="col-12">
                            <div class="form-group">
                                <label>Dirección</label>
                                <input type="text" class="form-control" name="address" value="{{teacher.address}}">
                            </div>
                        </div>
                        <div class="col-12 col-sm-6">
                            <div class="form-group">
                                <label>Ciudad</label>
                                <input type="text" class="form-control" name="city" value="{{teacher.city}}">
                            </div>
                        </div>
                        <div class="col-12 col-sm-6">
                            <div class="form-group">
                                <label>Estado</label>
                                <input type="text" class="form-control" name="state" value="{{teacher.state}}">
                            </div>
                        </div>
                        <div class="col-12 col-sm-6">
                            <div class="form-group">
                                <label>Código postal</label>
                                <input type="text" class="form-control" name="zip_code" value="{{teacher.zip_code}}">
                            </div>
                        </div>
                        <div class="col-12 col-sm-6">
                            <div class="form-group">
                                <label>País</label>
                                <input type="text" class="form-control" name="country" value="{{teacher.country}}">
                            </div>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary">Guardar</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
