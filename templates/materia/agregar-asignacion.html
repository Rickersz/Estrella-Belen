{% extends 'base.html' %}

{% block page_title %}Estrella de Belen - Agregar Asignacion{% endblock %}
{% block titulo_pagina %}Agregar Asignacion{% endblock %}

{% block content %}
<div class="row">
    <div class="col-sm-12">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a href="{% url 'assignment_list' %}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
